name: Windows desktop installer

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Reviewed source ref to package.
        required: true
        type: string
        default: dev-windesktop
      runtime-tag:
        description: Optional signed runtime-v* seed override; the reviewed release config is the default.
        required: false
        type: string
      desktop-tag:
        description: Exact desktop-v* tag matching the package version.
        required: true
        type: string
        default: desktop-v1.5.0
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: windows-desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate unsigned desktop update
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      desktop-tag: ${{ steps.release.outputs.desktop-tag }}
      runtime-tag: ${{ steps.release.outputs.runtime-tag }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      installer: ${{ steps.release.outputs.installer }}
      blockmap: ${{ steps.release.outputs.blockmap }}
      metadata: ${{ steps.release.outputs.metadata }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.source-ref }}
          persist-credentials: false

      - name: Resolve immutable desktop release inputs
        id: release
        shell: pwsh
        env:
          DISPATCH_DESKTOP_TAG: ${{ inputs.desktop-tag }}
          DISPATCH_RUNTIME_TAG: ${{ inputs.runtime-tag }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -Raw -LiteralPath 'apps/desktop/package.json' | ConvertFrom-Json
          $config = Get-Content -Raw -LiteralPath 'scripts/desktop-release/release-config.json' | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-preview\.(0|[1-9]\d*))?$') {
            throw 'desktop package version must be stable SemVer or x.y.z-preview.n.'
          }
          $channel = if ($version.Contains('-preview.')) { 'preview' } else { 'stable' }
          $expectedTag = "desktop-v$version"
          $desktopTag = if ($env:EVENT_NAME -eq 'push') { $env:PUSH_TAG } else { $env:DISPATCH_DESKTOP_TAG }
          if ($desktopTag -ne $expectedTag) { throw "desktop tag $desktopTag must equal $expectedTag." }
          $runtimeTag = if ([string]::IsNullOrWhiteSpace($env:DISPATCH_RUNTIME_TAG)) {
            [string]$config.seedRuntimeTag
          } else {
            $env:DISPATCH_RUNTIME_TAG
          }
          if ($runtimeTag -notmatch '^runtime-v[0-9A-Za-z][0-9A-Za-z.+-]*-r[1-9]\d*$') {
            throw 'runtime tag must be an immutable runtime-v*-rN release.'
          }
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($sourceSha -notmatch '^[0-9a-f]{40}$') { throw 'source checkout did not resolve to one commit.' }
          $installer = "DeepSeek-Harness-Desktop-$version-win-x64.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "desktop-tag=$desktopTag" >> $env:GITHUB_OUTPUT
          "runtime-tag=$runtimeTag" >> $env:GITHUB_OUTPUT
          "source-sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "blockmap=$installer.blockmap" >> $env:GITHUB_OUTPUT
          "metadata=$(if ($channel -eq 'preview') { 'preview.yml' } else { 'latest.yml' })" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install immutable workspace
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Download signed seed runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUNTIME_TAG: ${{ steps.release.outputs.runtime-tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'dist-desktop/runtime' | Out-Null
          gh release download $env:RUNTIME_TAG --repo $env:GH_REPO --dir 'dist-desktop/runtime' --pattern 'runtime-manifest.*' --pattern 'deepseek-harness-runtime-win32-x64-*.zip'
          pnpm exec tsx scripts/runtime-release/prepare-desktop-seed.ts --from dist-desktop/runtime

      - name: Build installer and electron-updater metadata
        shell: pwsh
        run: pnpm run desktop:dist

      - name: Smoke test packaged desktop and seed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smoke = Join-Path $env:RUNNER_TEMP 'desktop-smoke'
          $env:APPDATA = Join-Path $smoke 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $smoke 'AppData\Local'
          $env:DSH_HOME = Join-Path $smoke 'absent-legacy-home'
          $env:DSH_DESKTOP_DISABLE_UPDATE_CHECK = '1'
          $env:DSH_DESKTOP_SMOKE_TEST = '1'
          $env:DSH_DESKTOP_SMOKE_DATA_ROOT = $smoke
          $executable = 'dist-desktop\win-unpacked\DeepSeek Harness Desktop.exe'
          $process = Start-Process -FilePath $executable -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Packaged desktop smoke test exited with $($process.ExitCode)."
          }

      - name: Assemble strict unsigned release set
        shell: pwsh
        env:
          BLOCKMAP: ${{ steps.release.outputs.blockmap }}
          INSTALLER: ${{ steps.release.outputs.installer }}
          METADATA: ${{ steps.release.outputs.metadata }}
          SOURCE_SHA: ${{ steps.release.outputs.source-sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'dist-desktop/release'
          New-Item -ItemType Directory -Path $release | Out-Null
          foreach ($name in @($env:INSTALLER, $env:BLOCKMAP)) {
            $source = Join-Path 'dist-desktop' $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "desktop builder did not produce $name." }
            Copy-Item -LiteralPath $source -Destination (Join-Path $release $name)
          }
          $builderMetadata = 'dist-desktop/latest.yml'
          if (-not (Test-Path -LiteralPath $builderMetadata -PathType Leaf)) { throw 'desktop builder did not produce latest.yml.' }
          Copy-Item -LiteralPath $builderMetadata -Destination (Join-Path $release $env:METADATA)
          pnpm exec tsx scripts/desktop-release/generate-manifest.ts --directory $release --version $env:VERSION --source-commit $env:SOURCE_SHA

      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-update
          path: dist-desktop/release/*
          if-no-files-found: error
          retention-days: 14
