name: Sync upstream and release Windows runtime

on:
  push:
    branches:
      - master
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force-release:
        description: Build a new runtime revision even when upstream master is unchanged.
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-upstream-windows-runtime
  cancel-in-progress: false

jobs:
  sync:
    name: Select runtime source and pin desktop tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-needed: ${{ steps.sync.outputs.release-needed }}
      source-sha: ${{ steps.sync.outputs.source-sha }}
      tooling-sha: ${{ steps.sync.outputs.tooling-sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'master' }}
          fetch-depth: 0

      - name: Select runtime source and pin desktop tooling
        id: sync
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RELEASE: ${{ inputs.force-release || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$EVENT_NAME" = 'push' ]; then
            source_sha=$(git rev-parse HEAD)
          else
            git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
            git fetch --no-tags upstream master
            upstream_sha=$(git rev-parse upstream/master)
            if ! git merge-base --is-ancestor "$upstream_sha" HEAD; then
              git merge --no-edit --no-ff "$upstream_sha"
              # Keep fork-owned automation out of the upstream merge commit;
              # GITHUB_TOKEN has contents:write but cannot update workflow files.
              git checkout HEAD^ -- .github/workflows
              git diff --cached --quiet -- .github/workflows || git commit --amend --no-edit
              git push origin HEAD:master
            fi
            source_sha=$(git rev-parse HEAD)
          fi

          git fetch --no-tags origin dev-windesktop
          # Runtime packaging copies tooling into a separate source checkout;
          # upstream synchronization must not mutate the desktop branch.
          tooling_sha=$(git rev-parse origin/dev-windesktop)

          release_targets=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].target_commitish')
          release_needed=false
          if ! grep -Fqx "$source_sha" <<< "$release_targets"; then release_needed=true; fi
          if [ "$FORCE_RELEASE" = 'true' ]; then release_needed=true; fi
          echo "release-needed=$release_needed" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tooling-sha=$tooling_sha" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign, and publish updated runtime
    needs: sync
    if: needs.sync.outputs.release-needed == 'true'
    uses: ./.github/workflows/windows-runtime-release.yml
    with:
      source-ref: ${{ needs.sync.outputs.source-sha }}
      tooling-ref: ${{ needs.sync.outputs.tooling-sha }}
      runtime-revision: 0
      min-desktop-version: 1.0.0
      publish: true
    # A called workflow sees no caller secrets unless they are forwarded;
    # the sign job reads the repository-level RUNTIME_SIGNING_PRIVATE_KEY_PEM.
    secrets: inherit
